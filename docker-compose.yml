services:
  db:
    image: postgres:16
    container_name: loanapp_db
    environment:
      POSTGRES_USER: loanapp
      POSTGRES_PASSWORD: loanapp
      POSTGRES_DB: loanapp
    ports:
      - "55433:5432"
    volumes:
      - loanapp_db_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: loanapp_redis
    ports:
      - "56379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - loanapp_redis_data:/data
volumes:
  loanapp_db_data:
  loanapp_redis_data:
