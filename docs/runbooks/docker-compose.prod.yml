services:
  api:
    image: your-registry/loanapp-api:latest
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: ["node", "dist/main.js"]
    depends_on:
      - postgres
      - redis

  jobs-runner:
    image: your-registry/loanapp-api:latest
    env_file:
      - .env
    command: ["pnpm", "-C", "apps/api", "jobs:runner"]
    depends_on:
      - postgres
      - redis

  jobs-scheduler:
    image: your-registry/loanapp-api:latest
    env_file:
      - .env
    command: ["pnpm", "-C", "apps/api", "jobs:schedule"]
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: loanapp
      POSTGRES_PASSWORD: loanapp
      POSTGRES_DB: loanapp
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
