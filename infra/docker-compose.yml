services:
  db:
    image: postgres:16
    container_name: loanapp_db
    environment:
      POSTGRES_USER: loanapp
      POSTGRES_PASSWORD: loanapp
      POSTGRES_DB: loanapp
    ports:
      - "5432:5432"
    volumes:
      - loanapp_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: loanapp_redis
    ports:
      - "6379:6379"
    volumes:
      - loanapp_redis_data:/data

volumes:
  loanapp_db_data:
  loanapp_redis_data:
