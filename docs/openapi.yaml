openapi: 3.0.3
info:
  title: LoanApp API
  version: 1.0.0
  description: Frozen v1 API contract (all registered routes listed).
servers:
  - url: /api/v1
tags:
  - { name: Public }
  - { name: Auth }
  - { name: Me }
  - { name: BankAccounts }
  - { name: Files }
  - { name: Kyc }
  - { name: Loans }
  - { name: Payments }
  - { name: Webhooks }
  - { name: AdminAuth }
  - { name: AdminUsers }
  - { name: AdminBorrowers }
  - { name: AdminRoles }
  - { name: AdminLoans }
  - { name: AdminDisbursements }
  - { name: AdminUnderwriting }
  - { name: AdminReports }
  - { name: AdminJobs }
  - { name: AdminLenders }
  - { name: AdminAuditLogs }
  - { name: PlatformOnboarding }
  - { name: Dev }
paths:
  /health:
    get:
      tags: [Public]
      summary: Health check
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /public/config:
    get:
      tags: [Public]
      summary: Public tenant config
      parameters:
        - { $ref: '#/components/parameters/X-Lender-Id' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/StandardError' }

  /auth/request-otp:
    post:
      tags: [Auth]
      summary: Request OTP
      parameters:
        - { $ref: '#/components/parameters/X-Lender-Id' }
        - { $ref: '#/components/parameters/X-Device-Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '429': { $ref: '#/components/responses/StandardError' }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP
      parameters:
        - { $ref: '#/components/parameters/X-Lender-Id' }
        - { $ref: '#/components/parameters/X-Device-Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/StandardError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Borrower refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/StandardError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Borrower logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /me:
    get:
      tags: [Me]
      summary: Borrower me
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/StandardError' }

  /me/profile:
    put:
      tags: [Me]
      summary: Upsert profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /me/consents:
    post:
      tags: [Me]
      summary: Accept consent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
