components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    X-Request-Id:
      description: Request correlation ID
      schema: { type: string }
  parameters:
    X-Lender-Id:
      name: X-Lender-Id
      in: header
      required: true
      schema: { type: string }
    X-Lender-Id-Optional:
      name: X-Lender-Id
      in: header
      required: false
      schema: { type: string }
    X-Device-Id:
      name: X-Device-Id
      in: header
      required: false
      schema: { type: string }
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Query:
      name: query
      in: query
      required: false
      schema: { type: string }
    Status:
      name: status
      in: query
      required: false
      schema: { type: string }
    AsOf:
      name: asOf
      in: query
      required: false
      schema: { type: string, format: date-time }
    From:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: false
      schema: { type: string, format: date-time }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    LoanIdPath:
      name: loanId
      in: path
      required: true
      schema: { type: string }
    OfferIdPath:
      name: offerId
      in: path
      required: true
      schema: { type: string }
    ApplicationIdPath:
      name: applicationId
      in: path
      required: true
      schema: { type: string }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { nullable: true }
            requestId: { type: string }
          required: [code, message, details, requestId]
      required: [error]
    PaginatedEnvelope:
      type: object
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        nextCursor: { type: string, nullable: true }
      required: [items, nextCursor]
    GenericRequest:
      type: object
      additionalProperties: true
    GenericObject:
      type: object
      additionalProperties: true
    GenericArray:
      type: array
      items: { type: object, additionalProperties: true }
  responses:
    StandardError:
      description: Standard error envelope
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NoContent:
      description: No content
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
    Ok:
      description: Generic OK response
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericObject' }
    PaginatedOk:
      description: Generic paginated response
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
